name: verifica

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build:
      context: ../backend
    image: verifica-backend:local
    pull_policy: build
    environment:
      ENV: production
      DATA_DIR: /app/data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY ausente em deploy/.env}
      MODEL_NAME: ${MODEL_NAME:-google/gemma-4-26b-a4b-it}
      GATEWAY_KEY: ${GATEWAY_KEY:?GATEWAY_KEY ausente em deploy/.env}
      IP_HASH_KEY: ${IP_HASH_KEY:?IP_HASH_KEY ausente em deploy/.env}
      QUOTA_GLOBAL_DAILY: ${QUOTA_GLOBAL_DAILY:-200}
      QUOTA_PER_IP_DAILY: ${QUOTA_PER_IP_DAILY:-10}
      LLM_PER_MINUTE: ${LLM_PER_MINUTE:-15}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-2}
      LLM_MAX_PROMPT_PRICE: ${LLM_MAX_PROMPT_PRICE:-0.15}
      LLM_MAX_COMPLETION_PRICE: ${LLM_MAX_COMPLETION_PRICE:-0.60}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - verifica-data:/app/data
    networks:
      - verifica_net
    dns:
      - 1.1.1.1
      - 1.0.0.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    restart: on-failure

  tunnel:
    image: cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    user: "65532:65532"
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN ausente em deploy/.env}
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    networks:
      - verifica_net
    dns:
      - 1.1.1.1
      - 1.0.0.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
    restart: on-failure

networks:
  verifica_net:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.name: br-verifica
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  verifica-data:
